<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgroScan Pathology Report</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: #faf6f0; color: #3d3329; padding: 24px; line-height: 1.6; }
    .report-sheet { max-width: 820px; margin: 0 auto; background: #fff; border: 1px solid #e8dfd0; border-radius: 18px; padding: 32px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
    .header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; border-bottom: 2px solid #e8dfd0; padding-bottom: 18px; margin-bottom: 22px; }
    .brand { font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 700; }
    .brand-sub { font-family: 'Caveat', cursive; font-size: 1.2rem; color: #6b7f5e; }
    .meta { text-align: right; font-size: 0.82rem; color: #5c5346; }
    .top-grid { display: grid; grid-template-columns: 220px 1fr; gap: 22px; margin-bottom: 22px; }
    .leaf-photo { width: 100%; height: 190px; object-fit: cover; border-radius: 12px; border: 1px solid #e8dfd0; background: #f0e8dc; }
    .box { padding: 14px 16px; background: #faf6f0; border: 1px solid #e8dfd0; border-radius: 12px; margin-bottom: 14px; }
    .label { font-size: 0.74rem; font-weight: 700; text-transform: uppercase; color: #6b7f5e; margin-bottom: 4px; letter-spacing: 0.04em; }
    .print-bar { max-width: 820px; margin: 0 auto 14px; display: flex; justify-content: flex-end; gap: 10px; }
    .btn { padding: 9px 18px; border-radius: 10px; border: 1px solid #6b7f5e; background: #6b7f5e; color: #fff; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
    .footer { margin-top: 22px; padding-top: 14px; border-top: 1px solid #e8dfd0; font-size: 0.76rem; color: #8c8377; display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    @media (max-width: 640px) { .top-grid, .two { grid-template-columns: 1fr; } .meta { text-align: left; } }
    @media print { body { background: #fff; padding: 0; } .print-bar { display: none; } .report-sheet { box-shadow: none; border: none; padding: 12px; } }
  </style>
</head>
<body>
<div class="print-bar"><button class="btn" onclick="window.print()">🖨️ Print / Save as PDF</button></div>
<div class="report-sheet" id="sheet"><p>Loading report…</p></div>

<script src="/static/js/store.js"></script>
<script>
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const params = new URLSearchParams(location.search);
  const scan = Store.getScan(params.get("id"));
  const lang = params.get("lang") === "ta" ? "ta" : "en";
  const sheet = document.getElementById("sheet");

  if (!scan) {
    sheet.innerHTML = '<p>This report is only available in the browser that created the scan (your records are private to your device). Please open it from your <a href="/history">Archive</a>.</p>';
  } else {
    const info = scan.disease || {};
    const d = info[lang] || info.en;
    sheet.innerHTML = `
      <div class="header">
        <div><div class="brand">AgroScan<span style="color:#c75b3b;">.</span></div>
        <div class="brand-sub">Crop Disease Intelligence &amp; Treatment Report (UN SDG 2)</div></div>
        <div class="meta">
          <div><strong>Scan ID:</strong> #${esc(scan.scan_id)}</div>
          <div><strong>Date:</strong> ${esc(scan.timestamp)}</div>
          <div><strong>Crop Species:</strong> ${esc(scan.crop)}</div>
          <div><strong>Status:</strong> ${esc(scan.status || "Monitoring")}</div>
        </div>
      </div>
      <div class="top-grid">
        ${scan.image_url ? `<img class="leaf-photo" src="${scan.image_url}" alt="Leaf specimen">` : '<div class="leaf-photo"></div>'}
        <div>
          <div style="font-size:0.78rem;font-weight:700;color:#c75b3b;text-transform:uppercase;">Severity: ${esc((d.severity || "").toUpperCase())} • Confidence: ${esc(scan.confidence)}%</div>
          <h1 style="font-family:'Playfair Display',serif;font-size:1.6rem;margin-top:4px;">${esc(d.emoji)} ${esc(d.name)}</h1>
          <div style="font-style:italic;color:#5c5346;font-size:0.9rem;margin-bottom:12px;">Pathogen / Cause: ${esc(d.cause)}</div>
          <div class="box" style="margin-bottom:0;"><div class="label">Observed Symptoms</div><p style="font-size:0.88rem;">${esc(d.symptoms)}</p></div>
        </div>
      </div>
      <div class="two">
        <div class="box" style="margin:0;"><div class="label">🌦️ Favorable Weather Trigger</div><p style="font-size:0.86rem;">${esc(d.weather)}</p></div>
        <div class="box" style="margin:0;"><div class="label">⏱️ Expected Recovery Window</div><p style="font-size:0.86rem;font-weight:600;">${esc(d.recovery)}</p></div>
      </div>
      <div class="box"><div class="label">⚡ Immediate Field Action</div><p style="font-size:0.9rem;">${esc(d.immediate)}</p></div>
      <div class="box"><div class="label">🌿 Recommended Organic Remedy</div><p style="font-size:0.9rem;">${esc(d.organic)}</p></div>
      <div class="box"><div class="label">🧪 Chemical Control &amp; Dosage</div><p style="font-size:0.9rem;">${esc(d.chemical)}</p></div>
      <div class="box"><div class="label">🛡️ Long-Term Prevention Strategy</div><p style="font-size:0.9rem;">${esc(d.prevention)}</p></div>
      ${scan.notes ? `<div class="box"><div class="label">📝 Farmer Field Observation Note</div><p style="font-size:0.9rem;">${esc(scan.notes)}</p></div>` : ""}
      <div class="footer"><span>Generated by AgroScan AI (MobileNetV2 Transfer Learning)</span><span>UN SDG 2: Zero Hunger</span></div>`;
  }
</script>
</body>
</html>
